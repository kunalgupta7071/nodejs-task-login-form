<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submissions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container py-5">
      <h2 class="text-center text-primary mb-4">All Submissions</h2>
      <div id="submissionsList" class="row g-4"></div>
    </div>

    <script>
  fetch("/api/submissions")
    .then(res => res.json())
    .then(data => {
      let container = document.getElementById("submissionsList");
      container.innerHTML = "";
      data.forEach((item, i) => {
        container.innerHTML += `
          <div class="col-md-4">
            <div class="card shadow h-100">
              <div class="card-body">
                <h5 class="card-title text-primary">${item.name}</h5>
                <p class="card-text"><b>Email:</b> ${item.email}</p>
                <p class="card-text"><b>Age:</b> ${item.age}</p>
                <p class="card-text"><b>Message:</b> ${item.message || "N/A"}</p>
              </div>
            </div>
          </div>
        `;
      });
    });
</script>

  </body>
</html>
