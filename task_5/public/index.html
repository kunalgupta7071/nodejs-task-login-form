<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Student CRUD App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container py-5">
      <h2 class="text-center mb-4">🎓 Student Details - CRUD</h2>
      <div class="card p-3 shadow-sm mb-4">
        <form id="studentForm" class="row g-3">
          <div class="col-md-4">
            <input type="text" id="name" class="form-control" placeholder="Name"
              required>
          </div>
          <div class="col-md-3">
            <input type="number" id="age" class="form-control" placeholder="Age"
              required>
          </div>
          <div class="col-md-3">
            <input type="text" id="course" class="form-control"
              placeholder="Course" required>
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">Add</button>
          </div>
        </form>
      </div>
      <table class="table table-striped shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
